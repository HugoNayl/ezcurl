[package]
name = "ezcurl"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/HugoNayl/ezcurl.git"
license = "Apache-2.0"
description = "ezcurl is postman in the terminal."
repository = "https://github.com/HugoNayl/ezcurl"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
unicode-width = "0.2.2"

[lints]
clippy = { all = "deny" }
rust = { unsafe_code = "forbid" }

[profile.release]
opt-level = 3
strip = "symbols"
lto = "fat"
codegen-units = 1
